<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에멀전 리프트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="즉석사진의 이미지 막을 물에서 떼어 종이와 돌, 벽돌 위에 옮기는 에멀전 리프트 작업실. An emulsion lift studio in the browser.">
<link rel="preload" href="fonts/Pretendard-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Layout follows the Figma "web" page: white ground, three symbols across the top (? + @), one thing on screen at a time, a chevron to move on. */
@font-face { font-family: "Pretendard"; src: url("fonts/Pretendard-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
:root {
  --ground: #ffffff;
  --ink: #111111;
  --symbol-on: #514f4f;
  --symbol-off: #bababa;
  --text: #6d6d6d;
  --hair: #e4e4e4;
  --plate: #d9d9d9;
  /* Latin in Arial, Hangul falls through to Pretendard; regular weight throughout */
  --f-sans: Arial, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-sans); font-weight: 400; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
strong, b, h1, h2, h3, th { font-weight: 400; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top symbols: ? at 9.6%, + centred, @ at 89% of a 1920 frame */
.topnav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ground);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  height: 112px; padding-inline: max(16px, 9.6vw) max(16px, 9.6vw);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--ground); z-index: 21; }
.sym { color: var(--symbol-off); line-height: 1; font-weight: 400; transition: color .2s; padding: 6px; height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
.sym .glyph { display: block; line-height: 1; }
.sym:hover { color: var(--symbol-on); }
.sym[aria-current="page"] { color: var(--symbol-on); }
.sym.q { font-size: 27px; justify-self: start; }
.sym.plus { font-size: 32px; }
.sym.plus[aria-current="page"] { color: #000; }
.sym.at { font-size: 20px; justify-self: end; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* small text controls, as in "+ change image" / "+ add image" */
.link { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; color: var(--ink); }
.link svg { width: 24px; height: 24px; flex: none; }
.link.quiet { color: var(--symbol-off); }
.link.quiet:hover, .link.quiet[aria-pressed="true"] { color: var(--ink); }
.link:disabled { opacity: .35; cursor: default; }
.file-link { position: relative; overflow: hidden; cursor: pointer; }
.file-link input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.chev { width: 48px; height: 48px; display: grid; place-items: center; color: #9e9e9e; }
.chev svg { width: 48px; height: 48px; }
.chev:hover:not(:disabled) { color: var(--ink); }
.chev:disabled { opacity: .25; cursor: default; }

/* ---------- main: works laid out loosely in a column ---------- */
.home { max-width: 900px; margin: 0 auto; padding-block: 24px 120px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 44px; }
.captions { grid-column: 1 / -1; margin: 0 0 28px; padding: 0; list-style: none; font-size: 12px; line-height: 1.45; color: #9a9a9a; }
.col { display: grid; gap: 0; align-content: start; }
.work { display: block; position: relative; text-align: left; }
.work img { display: block; width: 100%; height: auto; }
.work .no { display: block; font-size: 11px; color: #9a9a9a; margin-top: 8px; }
.work:hover img { opacity: .92; }
.home-note { grid-column: 1 / -1; font-size: 13px; color: #9a9a9a; margin: 40px 0 0; text-align: center; }
.work.arrive { animation: arrive 1.2s cubic-bezier(.2,.7,.2,1) both; }
@keyframes arrive { from { opacity: .2; transform: translateY(14px); } }

/* ---------- ? : text left, picture right ---------- */
.about { max-width: 1512px; margin: 0 auto; padding-block: 135px 120px; padding-inline: max(16px, 10.6vw) max(16px, 11vw); display: grid; grid-template-columns: minmax(0, 638px) minmax(0, 642px); justify-content: space-between; gap: 48px; align-items: start; }
.about-text { font-weight: 400; font-size: 16px; color: var(--text); line-height: 1.21; }
.about-text h1, .about-text h2 { font: inherit; margin: 0 0 19px; }
.about-text p, .about-text ul, .about-text ol { margin: 0 0 38px; }
.about-text ul, .about-text ol { padding-left: 0; list-style: none; }
.about-text .sec { margin-bottom: 0; }
.about-fig { margin: 0; position: sticky; top: 140px; }
.about-fig .pic { background: #f4f4f4; padding: 5%; }
.about-fig img { display: block; width: 100%; height: auto; max-height: calc(100vh - 300px); object-fit: contain; }
.about-fig figcaption { font-size: 16px; color: var(--ink); margin-top: 16px; }

/* ---------- + : one step per screen ---------- */
.studio { position: relative; min-height: calc(100vh - 160px); display: grid; grid-template-rows: auto auto 1fr; justify-items: center; padding-bottom: 90px; }
.stage { position: relative; width: min(1000px, 92vw, calc((100vh - 300px) * 4 / 3)); aspect-ratio: 4 / 3; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.stage.tool-on canvas { cursor: none; }
#cursor { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); border: 1px solid rgba(0,0,0,.55); box-shadow: 0 0 0 1px rgba(255,255,255,.7); }
.dropzone { position: absolute; inset: 8%; border: 1px dashed var(--symbol-on); display: grid; place-items: center; background: rgba(255,255,255,.85); pointer-events: none; font-size: 14px; }
.gl-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--text); }
.under { width: min(1000px, 92vw); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; margin-top: 6px; }
.status { font-size: 13px; color: #9a9a9a; font-variant-numeric: tabular-nums; }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.ctl .grp { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.ctl .sep { width: 1px; height: 16px; background: var(--hair); }
.range { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); }
.range input { width: 140px; accent-color: var(--symbol-on); }
.range output { color: var(--ink); min-width: 3.2em; font-variant-numeric: tabular-nums; }
.line { width: 160px; height: 1px; background: var(--hair); }
.line > i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .15s linear; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text); }
.check input { accent-color: var(--ink); }
.explain { grid-column: 1 / -1; max-width: 62ch; font-size: 13px; line-height: 1.6; color: #8a8a8a; margin: 8px 0 0; }
.explain strong { color: var(--ink); font-weight: 400; }
.next { position: fixed; right: max(16px, 9.6vw); bottom: calc(env(safe-area-inset-bottom, 0px) + 56px); z-index: 15; }
.result { width: min(1000px, 92vw); display: grid; place-items: center; }

/* surface choice: things scattered on white, a chevron each side to change kind */
.pick { width: 100%; max-width: 1920px; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 0 max(16px, 3vw); padding-inline: max(16px, 9.6vw); min-height: calc(100vh - 220px); }
.pick-title { grid-column: 1 / -1; text-align: center; font-size: 13px; color: #9a9a9a; margin: 0 0 10px; }
.pick-items { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 46px 34px; padding-block: 10px 40px; }
.pick-item { position: relative; display: block; }
.pick-items .pick-item img { width: 100%; height: 100%; }
.board { display: none; }
.pick.as-board { position: fixed; inset: 0; z-index: 10; background: var(--ground); display: block; padding: 0; min-height: 0; }
.pick.as-board .pick-title, .pick.as-board .pick-note, .pick.as-board .pick-items { display: none; }
.pick.as-board .board { display: block; position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--s, .5)); transform-origin: center; }
.board .pick-item { position: absolute; pointer-events: none; }
.board { cursor: default; } .board.over-item { cursor: pointer; }
.board .pick-item.hover img { transform: translateY(-4px); }
.board .pick-item.hover .nm, .board .pick-item:focus-visible .nm { opacity: 1; }
.board .pick-add, .board .chev { pointer-events: auto; }
.board .pick-item img { width: 100%; height: 100%; display: block; }
.board .pick-add { position: absolute; left: 1287px; top: 552px; gap: 5px; padding: 0; }
.board .chev { position: absolute; top: 540px; }
.board #catPrev { left: 187px; } .board #catNext { left: 1660px; }
body.picking-board .topnav { background: transparent; }
body.picking-board .foot { visibility: hidden; }
.pick-item img { display: block; width: 100%; height: auto; transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.pick-item:hover img, .pick-item:focus-visible img { transform: translateY(-4px); }
.pick-item .nm { position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: #9a9a9a; opacity: 0; transition: opacity .2s; pointer-events: none; }
.board .pick-item .nm { bottom: auto; transform: none; font-size: 16px; z-index: 2; }
.pick-item:hover .nm, .pick-item:focus-visible .nm { opacity: 1; }
.pick-add { align-self: center; padding: 20px; }
.pick-note { grid-column: 1 / -1; text-align: center; font-size: 12px; color: #9a9a9a; margin: 18px auto 0; max-width: 60ch; }

/* ---------- @ : archive ---------- */
.archive { max-width: 900px; margin: 0 auto; padding-block: 24px 120px; }
.archive-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 30px; }
.archive-head p { margin: 0; font-size: 13px; color: #9a9a9a; max-width: 56ch; }
.archive .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 44px; }
.artist { display: grid; gap: 10px; max-width: 638px; margin-bottom: 44px; }
.artist-name, .artist-statement, .login input { font: inherit; color: var(--ink); border: 0; border-bottom: 1px solid var(--hair); background: transparent; padding: 6px 0; width: 100%; outline: none; }
.artist-name { font-size: 16px; }
.artist-statement { font-size: 16px; line-height: 1.5; color: var(--text); resize: vertical; }
.artist-name:focus, .artist-statement:focus, .login input:focus { border-bottom-color: var(--ink); }
.account { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin-bottom: 26px; }
.login { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.login input { width: min(280px, 70vw); font-size: 15px; }
.archive-empty { text-align: center; color: #9a9a9a; font-size: 14px; padding-block: 80px; }

/* ---------- viewer ---------- */
.viewer { position: fixed; inset: 0; z-index: 30; background: var(--ground); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: calc(env(safe-area-inset-top, 0px) + 28px) max(16px, 9.6vw) calc(env(safe-area-inset-bottom, 0px) + 28px); }
.vbar { display: flex; justify-content: flex-end; gap: 22px; flex-wrap: wrap; font-size: 14px; }
.vbar button { color: #9a9a9a; } .vbar button:hover { color: var(--ink); }
.vbar .warn:hover { color: #a33; }
.vstage { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 12px; min-height: 0; }
.vstage figure { margin: 0; height: 100%; min-height: 0; display: grid; place-items: center; }
.vstage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.vmeta { text-align: center; padding-top: 16px; font-size: 12px; color: #9a9a9a; display: grid; gap: 2px; }
.vmeta .t { color: var(--ink); font-size: 13px; }

/* footer: name and language */
.foot { display: flex; gap: 14px; font-size: 12px; color: var(--symbol-off); padding: 0 max(16px, 2vw) calc(env(safe-area-inset-bottom, 0px) + 22px); }
.foot button[aria-pressed="true"], .foot a:hover, .foot button:hover { color: var(--symbol-on); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); z-index: 40; background: var(--ink); color: #fff; padding: 8px 14px; font-size: 13px; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 900px) {
  .topnav { height: 84px; }
  .about { grid-template-columns: minmax(0, 1fr); padding-top: 40px; }
  .about-fig { position: static; order: -1; }
  .studio { min-height: calc(100vh - 84px); }
  .pick { grid-template-columns: 36px minmax(0, 1fr) 36px; padding-inline: 8px; }
  .pick .chev, .pick .chev svg { width: 36px; height: 36px; }
  .next { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
}
@media (max-width: 560px) {
  .home, .archive .grid { gap: 0 20px; }
}
@media (prefers-reduced-motion: reduce) { .work.arrive { animation: none; } .pick-item img { transition: none; } }
</style>
</head>
<body>
<nav class="topnav" aria-label="menu">
  <a class="sym q" href="#about" id="nav-about"><span class="glyph" aria-hidden="true">?</span><span class="sr" data-i18n="nav.about">소개</span></a>
  <a class="sym plus" href="#studio" id="nav-studio"><span class="glyph" aria-hidden="true">+</span><span class="sr" data-i18n="nav.new">새 리프트</span></a>
  <a class="sym at" href="#archive" id="nav-archive"><span class="glyph" aria-hidden="true">@</span><span class="sr" data-i18n="nav.archive">아카이브</span></a>
</nav>

<!-- MAIN -->
<main id="view-home" class="wrap">
  <div class="home" id="home">
    <ol class="captions" id="captions"></ol>
    <div class="col" id="colA"></div>
    <div class="col" id="colB"></div>
    <p class="home-note" id="homeNote"></p>
  </div>
</main>

<!-- ? -->
<main id="view-about" hidden>
  <div class="about">
    <article class="about-text" id="aboutBody"></article>
    <figure class="about-fig">
      <div class="pic"><img id="aboutImg" src="examples/ex1.webp" width="900" height="814" alt=""></div>
      <figcaption id="aboutCap"></figcaption>
    </figure>
  </div>
</main>

<!-- + -->
<main id="view-studio" hidden>
  <div class="studio">
    <div class="stage" id="stage">
      <canvas id="gl"></canvas>
      <div id="cursor" hidden></div>
      <div class="dropzone" id="dropzone" hidden data-i18n="studio.drop">여기에 사진을 놓으세요</div>
    </div>

    <section class="pick" id="pick" hidden aria-labelledby="pickTitle">
      <p class="pick-title" id="pickTitle"></p>
      <button type="button" class="chev" id="catPrev" aria-label="previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m14 18-6-6 6-6 1.4 1.4-4.6 4.6 4.6 4.6z"/></svg></button>
      <div class="pick-items" id="pickItems"></div>
      <div class="board" id="board"></div>
      <button type="button" class="chev" id="catNext" aria-label="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.6 12 8 7.4 9.4 6l6 6-6 6L8 16.6z"/></svg></button>
      <p class="pick-note" data-i18n="s4.uploadNote"></p>
    </section>

    <div class="under" id="under">
      <div class="status" id="readout"></div>

      <div class="ctl" data-step="1">
        <div class="grp" id="filmSeg">
          <button type="button" class="link quiet" id="film-integral" data-film="integral" aria-pressed="true" data-i18n="film.integralShort">인티그럴</button>
          <button type="button" class="link quiet" id="film-peel" data-film="peel" aria-pressed="false" data-i18n="film.peelShort">필 어파트</button>
        </div>
        <span class="sep"></span>
        <button type="button" class="link quiet" id="sampleBtn" data-i18n="s1.sample">다른 예시</button>
        <label class="link file-link" for="file"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 19v-6H5v-2h6V5h2v6h6v2h-6v6z"/></svg><span data-i18n="s1.change">사진 바꾸기</span><input type="file" id="file" accept="image/*"></label>
      </div>

      <div class="ctl" data-step="2" hidden>
        <label class="range" for="temp"><span data-i18n="s2.temp">물 온도</span><input type="range" id="temp" min="30" max="90" step="1" value="45"><output id="tempOut" for="temp">45°C</output></label>
        <div class="line" aria-hidden="true"><i id="soakBar"></i></div>
        <button type="button" class="link quiet" id="soakBtn" data-i18n="s2.again">다시 담그기</button>
      </div>

      <div class="ctl" data-step="3" hidden>
        <div class="grp" id="tool3Seg">
          <button type="button" class="link quiet" id="t3-release" data-tool="release" aria-pressed="true" data-i18n="tool.release">떼어내기</button>
          <button type="button" class="link quiet" id="t3-push" data-tool="push" aria-pressed="false" data-i18n="tool.push">밀기</button>
        </div>
        <label class="range" for="brush3"><span data-i18n="tool.size">붓</span><input type="range" id="brush3" min="25" max="160" value="70"></label>
        <div class="line" aria-hidden="true"><i id="relBar"></i></div>
        <button type="button" class="link quiet" id="autoRelease" data-i18n="s3.auto">남은 부분 한꺼번에 떼기</button>
      </div>

      <div class="ctl" data-step="4" hidden>
        <div class="grp" id="tool4Seg">
          <button type="button" class="link quiet" id="t4-push" data-tool="push" aria-pressed="true" data-i18n="tool.push">밀기</button>
          <button type="button" class="link quiet" id="t4-pinch" data-tool="pinch" aria-pressed="false" data-i18n="tool.pinch">주름 모으기</button>
          <button type="button" class="link quiet" id="t4-smooth" data-tool="smooth" aria-pressed="false" data-i18n="tool.smooth">펴기</button>
          <button type="button" class="link quiet" id="t4-tear" data-tool="tear" aria-pressed="false" data-i18n="tool.tear">찢기</button>
        </div>
        <label class="range" for="brush4"><span data-i18n="tool.size">붓</span><input type="range" id="brush4" min="20" max="200" value="70"></label>
        <span class="sep"></span>
        <div class="grp">
          <button type="button" class="link quiet" id="flipBtn" data-i18n="s4.flip">뒤집기</button>
          <button type="button" class="link quiet" id="dipBtn" data-i18n="s4.dip">담갔다 빼기</button>
          <button type="button" class="link quiet" id="shakeBtn" data-i18n="s4.shake">흔들기</button>
          <button type="button" class="link quiet" id="undoBtn" disabled data-i18n="s4.undo">되돌리기</button>
          <button type="button" class="link quiet" id="changeSurf" data-i18n="s4.change">표면 바꾸기</button>
        </div>
        <label class="check" id="whiteWrap" hidden><input type="checkbox" id="whiteLayer"><span data-i18n="s4.white">흰 층 남기기</span></label>
      </div>

      <div class="ctl" data-step="5" hidden>
        <div class="line" aria-hidden="true"><i id="dryBar"></i></div>
        <button type="button" class="link quiet" id="saveBtn" disabled data-i18n="s5.save">PNG로 저장</button>
        <button type="button" class="link quiet" id="backBtn" data-i18n="s5.back">다시 적시기</button>
      </div>

      <p class="explain" id="explain"></p>
      <p class="explain" id="saveNote" hidden></p>
    </div>

    <button type="button" class="chev next" id="nextBtn" aria-label="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.6 12 8 7.4 9.4 6l6 6-6 6L8 16.6z"/></svg></button>
  </div>
  <input type="file" id="surfUpload" accept="image/*" hidden>
</main>

<!-- @ -->
<main id="view-archive" class="wrap" hidden>
  <div class="archive">
    <section class="artist" id="artist" hidden aria-label="artist">
      <input type="text" id="artistName" class="artist-name" maxlength="80" autocomplete="name">
      <textarea id="artistStatement" class="artist-statement" rows="5" maxlength="4000"></textarea>
      <div class="row"><button type="button" class="link quiet" id="artistSave" data-i18n="art.save">저장</button><span class="status" id="artistMsg" role="status"></span></div>
    </section>
    <div class="account" id="account" hidden>
      <form class="login" id="loginForm" hidden>
        <label class="sr" for="loginEmail" data-i18n="acc.email">이메일</label>
        <input type="email" id="loginEmail" autocomplete="email" required>
        <button type="submit" class="link" id="loginBtn" data-i18n="acc.send">로그인 링크 받기</button>
      </form>
      <span class="status" id="acctEmail"></span>
      <button type="button" class="link quiet" id="logoutBtn" hidden data-i18n="acc.logout">로그아웃</button>
      <button type="button" class="link quiet" id="migrateBtn" hidden></button>
    </div>

/* ---------- the three symbols: same apparent size ----------
   Sized by measured ink height, not font size. A cross spreads its strokes wide and an @ is dense,
   so both read larger than a ? of the same height: + is set to 90% and @ to 92% of the ? height.
   Each glyph is then shifted so the centres of the ink, not the baselines, share one line. */
const SYMBOL_RATIO = { '?': 1, '+': 0.9, '@': 0.92 };
function sizeSymbols() {
  const H = innerWidth < 560 ? 16 : 19;
  const g = document.createElement('canvas').getContext('2d');
  document.querySelectorAll('.topnav .glyph').forEach(el => {
    const ch = el.textContent, family = getComputedStyle(el).fontFamily;
    g.font = `400 100px ${family}`;
    const m = g.measureText(ch);
    const ink = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    if (!ink) return;
    const fs = H * SYMBOL_RATIO[ch] * 100 / ink;
    const asc = m.fontBoundingBoxAscent / 100, desc = m.fontBoundingBoxDescent / 100;
    const baseline = (1 - (asc + desc)) / 2 + asc;              // baseline from top of a line-height:1 box, per 1px of font size
    const inkMid = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 200;
    el.style.fontSize = fs.toFixed(2) + 'px';
    el.style.transform = `translateY(${((inkMid - (baseline - 0.5)) * fs).toFixed(2)}px)`;
  });
}
let symNarrow = innerWidth < 560;
window.addEventListener('resize', () => { const n = innerWidth < 560; if (n !== symNarrow) { symNarrow = n; sizeSymbols(); } });

/* ---------- pointer on the tray ---------- */
function worldPt(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H, r]; }
function moveCursor(e) {
  const [x, y, r] = worldPt(e), c = $('cursor');
  const d = brushR() * 2 * r.width / W * (state.phase === 4 && state.tool4 === 'tear' ? 0.45 : 1);
  c.style.width = c.style.height = d + 'px';
  c.style.left = (x / W * r.width) + 'px'; c.style.top = (y / H * r.height) + 'px';
}
canvas.addEventListener('pointerenter', e => { ptr.in = true; $('cursor').hidden = !toolActive(); moveCursor(e); });
canvas.addEventListener('pointerleave', () => { ptr.in = false; $('cursor').hidden = true; });
canvas.addEventListener('pointerdown', e => {
  if (!toolActive() || !M) return;
  canvas.setPointerCapture(e.pointerId); ptr.id = e.pointerId;
  const [x, y] = worldPt(e); ptr.down = true; ptr.x = x; ptr.y = y;
  ptr.in = true; $('cursor').hidden = false; moveCursor(e);
  if (state.phase === 4) { pushUndo(); M.touch.fill(0); if (state.tool4 === 'tear') applyTear(x, y, state.brush4); }
  if (state.phase === 3 && state.tool3 === 'release') applyRelease(x, y, state.brush3);
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  moveCursor(e);
  if (!ptr.down || e.pointerId !== ptr.id) return;
  const [x, y] = worldPt(e), dx = x - ptr.x, dy = y - ptr.y;
  ptr.x = x; ptr.y = y;
  if (state.phase === 3 && state.tool3 === 'push') {
    const { inv, P, V } = M, r = state.brush3;
    for (let k = 0; k < M.n; k++) {
      if (inv[k] === 0) continue;
      const ex = P[2 * k] - x, ey = P[2 * k + 1] - y, d2 = ex * ex + ey * ey;
      if (d2 > r * r * 2.2) continue;
      const f = gauss(d2, r); P[2 * k] += dx * f; P[2 * k + 1] += dy * f; V[2 * k] = dx * f * 0.3; V[2 * k + 1] = dy * f * 0.3;
    }
  }
  if (state.phase === 4) {
    if (state.tool4 === 'push') { applyPush(x, y, state.brush4, dx, dy); state.simFrames = 30; }
    if (state.tool4 === 'tear') applyTear(x, y, state.brush4);
  }
});
function endStroke(e) {
  if (!ptr.down || (e && e.pointerId !== ptr.id)) return;
  ptr.down = false;

}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
function resize() {
  if (exporting || !gl) return;
  const r = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.min(2400, Math.round(r.width * dpr)), h = Math.round(w * 3 / 4);

}

window.addEventListener('resize', () => { const n = innerWidth < 700; if (n !== lastNarrow) { lastNarrow = n; if (state.picking) renderPick(); } });

/* ---------- studio controls ---------- */
function bindSeg(segId, attr, fn) {
  const seg = $(segId);
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    fn(b.dataset[attr]);
  });
}
bindSeg('filmSeg', 'film', v => {
  if (state.film === v) return;
  state.film = v; state.temp = baseTemp(); $('temp').value = state.temp;
  if (v !== 'integral') { state.whiteLayer = false; $('whiteLayer').checked = false; }
  setTempNote();
  if (state.srcImg && gl) loadImage(state.srcImg);
});
bindSeg('tool3Seg', 'tool', v => { state.tool3 = v; updateReadout(); });
bindSeg('tool4Seg', 'tool', v => { state.tool4 = v; updateReadout(); });
$('whiteLayer').addEventListener('change', e => { state.whiteLayer = e.target.checked; });
$('temp').addEventListener('input', e => { state.temp = +e.target.value; setTempNote(); updateReadout(); });
$('temp').addEventListener('change', () => { if (state.phase === 2) startSoak(); });
$('brush3').addEventListener('input', e => { state.brush3 = +e.target.value; });
$('brush4').addEventListener('input', e => { state.brush4 = +e.target.value; });
$('soakBtn').addEventListener('click', startSoak);
$('autoRelease').addEventListener('click', () => { state.autoRel = 0; });
$('flipBtn').addEventListener('click', () => { pushUndo(); flip(); updateReadout(); toast(t('t.flipped')); });
$('dipBtn').addEventListener('click', () => { pushUndo(); M.touch.fill(1); state.dip = 1; });
$('shakeBtn').addEventListener('click', () => { pushUndo(); shake(); });
$('undoBtn').addEventListener('click', popUndo);
$('changeSurf').addEventListener('click', openPick);
$('saveBtn').addEventListener('click', () => state.result && saveBlob(state.result.blob, `emulsion-lift-${fileDate()}.png`, $('saveNote')));
$('backBtn').addEventListener('click', () => { state.drying = false; state.dryP = 0; state.result = null; setPhase(4); });
$('nextBtn').addEventListener('click', async () => {
  const ph = state.phase;
  if (ph === 1) { setPhase(2); startSoak(); }
  else if (ph === 2 && state.soakDone) enterLift();
  else if (ph === 3 && relFrac >= 0.97) openPick();
  else if (ph === 4) enterDry();
  else if (ph === 5 && state.result) { await keepResult(); location.hash = 'archive'; }
});

function readFile(file) {
  if (!file || !file.type.startsWith('image/')) { toast(t('t.notImage')); return; }
  const url = URL.createObjectURL(file);
  loadImg(url).then(img => { loadImage(img); URL.revokeObjectURL(url); toast(t('t.printed')); })
    .catch(() => { URL.revokeObjectURL(url); toast(t('t.openFail')); });
}
$('file').addEventListener('change', e => { if (gl) readFile(e.target.files[0]); e.target.value = ''; });
$('sampleBtn').addEventListener('click', () => { if (gl) loadSample().then(loadImage).catch(() => toast(t('t.openFail'))); });
const stageEl = $('stage');
stageEl.addEventListener('dragover', e => { e.preventDefault(); if (gl && state.phase === 1) $('dropzone').hidden = false; });
stageEl.addEventListener('dragleave', e => { if (!stageEl.contains(e.relatedTarget)) $('dropzone').hidden = true; });
stageEl.addEventListener('drop', e => { e.preventDefault(); $('dropzone').hidden = true; if (gl) readFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', e => {
  if (state.view !== 'studio' || !gl) return;
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (it) readFile(it.getAsFile());
});

/* ---------- renders one lift without the hand; used to make the bundled examples ---------- */
async function autoLift({ scene, film: f = 'peel', surface = 'cold', temp, flip: fl = false, shakes = 1, maxSide = 1000 }) {
  state.film = f; state.temp = temp || (f === 'integral' ? 45 : 70); state.surface = surface;
  await ensureSurface(surface);
  loadImage(await loadSample(scene));
  finishSoak(); enterLift();
  M.rel.fill(1); M.inv.fill(1);
  enterPaper(); updateMask(); composeBG();
  if (fl) flip();
  for (let i = 0; i < shakes; i++) shake();
  for (let i = 0; i < 40; i++) { M.inv.fill(1); solve(4); computeComp(); }
  state.phase = 5; state.dryP = 1; composeBG();
  const r = await renderCutout(maxSide);
  return { url: r.canvas.toDataURL('image/webp', 0.86), w: r.w, h: r.h };
}

/* ---------- boot ---------- */
applyLang();
sizeSymbols();
cloud.init().finally(route);
requestAnimationFrame(frame);
window.__lift = { state, autoLift, get M() { return M; } };
})();
</script>
